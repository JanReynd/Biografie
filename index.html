try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.version===1){for(const k of ['fields','answers','tasks','reviewed','practice','selection'])if(saved[k]&&typeof saved[k]==='object'&&!Array.isArray(saved[k]))state[k]=saved[k];if(Array.isArray(saved.goals))state.goals=saved.goals.filter(x=>goals.some(g=>g.id===x)).slice(0,2);if(Array.isArray(saved.attempts))state.attempts=saved.attempts.filter(a=>Number.isFinite(a.elapsed)&&a.elapsed>=0&&a.elapsed<=180).slice(-8);}}catch(e){storageOK=false;}

const iconPaths={card:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6M7 17h8"/>',wave:'<path d="M3 10v4m4-8v12m5-16v20m5-16v12m4-8v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',chat:'<path d="M20 11a8 8 0 0 1-8 8H4l1-4a8 8 0 1 1 15-4Z"/><path d="M8 10h8M8 14h5"/>',leaf:'<path d="M20 3C6 2 1 9 6 16s16 0 14-13Z"/><path d="M4 21 16 8"/>',hourglass:'<path d="M6 3h12M6 21h12M7 3v4l5 5-5 5v4M17 3v4l-5 5 5 5v4"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',mic:'<rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>',play:'<path d="m7 3 14 9-14 9Z"/>',print:'<path d="M7 7V2h10v5M6 17H3V8h18v9h-3M7 14h10v8H7Z"/>',audience:'<circle cx="12" cy="6" r="3"/><path d="M6 20v-5a6 6 0 0 1 12 0v5M3 6a2 2 0 1 1 0 4m18-4a2 2 0 1 0 0 4M1 20v-5a4 4 0 0 1 3-4m19 9v-5a4 4 0 0 0-3-4"/>'};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.spark}</svg>`;}
function save(){try{localStorage.setItem(key,JSON.stringify({...state,version:1}));storageOK=true;}catch(e){storageOK=false;}updateSave();updateProgress();}
function updateSave(){if($('#save-status'))$('#save-status').textContent=storageOK?'Bewaard op dit toestel':'Bewaar je werk via ‘Download mijn werk’';}
function toast(msg){clearTimeout(toastTimeout);$('#toast').textContent=msg;$('#toast').hidden=false;toastTimeout=setTimeout(()=>$('#toast').hidden=true,5000);}
function fmt(s){s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function secondsLeft(deadline,now=Date.now()){return Math.max(0,Math.min(180,Math.ceil((deadline-now)/1000)));}
function phaseAt(elapsed){return elapsed>=180?'stop':elapsed>=170?'afronden':elapsed>=150?'slot':'vertellen';}
function field(id,label,placeholder='',type='textarea',hint=''){return `<label class="form-field"><span>${label}</span>${type==='textarea'?`<textarea data-field="${id}" rows="3" placeholder="${esc(placeholder)}"></textarea>`:`<input type="text" data-field="${id}" placeholder="${esc(placeholder)}">`}${hint?`<span class="hint">${hint}</span>`:''}</label>`;}
function taskCheck(id,label){return `<label class="checkline"><input type="checkbox" data-task="${id}" ${state.tasks[id]?'checked':''}><span>${label}</span></label>`;}
function miniCheck(id,label,help=''){return `<div class="mini-check"><label><input type="checkbox" data-practice="${id}" ${state.practice[id]?'checked':''}><span><strong>Probeer & controleer</strong>${label}</span></label>${help?`<p class="help">${help}</p>`:''}</div>`;}
function miniTimer(id,seconds=30){return `<div class="microtimer"><button class="btn quiet small" data-action="mini" data-mini="${id}" data-seconds="${seconds}">${icon('play')} Oefen ${seconds} seconden</button><output id="mini-${id}">${fmt(seconds)}</output></div><p class="mini-status" id="mini-status-${id}" aria-live="polite"></p>`;}
function recommended(ids){return ids.some(x=>state.goals.includes(x))?'<span class="recommended">Past bij jouw werkpunt</span>':'';}
function exerciseHead(n,title,time,ids=[]){return `<div class="exercise-head"><span class="exercise-num">${n}</span><div><h3>${title}</h3><p class="duration">${time}</p></div>${recommended(ids)}</div>`;}
function intro(n,title,lead,ic){return `<div class="page-intro"><div><p class="eyebrow">Onderdeel ${n} / 06</p><h1 tabindex="-1">${title}</h1><p class="lead">${lead}</p></div><div class="page-badge">${icon(ic)}</div></div>`;}
function heroArt(){return `<svg class="hero-art" viewBox="0 0 460 350" role="img" aria-label="Van een spreekkaart met kernwoorden naar een levendig verhaal in drie minuten"><path d="M85 310C-25 222 64 51 216 42c175-11 229 99 160 214-55 92-208 124-291 54" fill="#31584b"/><g transform="translate(60 85) rotate(-10 85 100)"><rect width="158" height="205" rx="16" fill="#f7f5e7"/><rect x="20" y="23" width="61" height="12" rx="6" fill="#afc68a"/><path d="M21 65h100M21 91h73M21 117h88" stroke="#8ba17a" stroke-width="8" stroke-linecap="round"/><rect x="20" y="153" width="106" height="28" rx="8" fill="#dce9be"/><text x="34" y="172" fill="#193c3a" font-size="12" font-family="Segoe UI, sans-serif" font-weight="700">KERNWOORDEN</text></g><path d="M217 209q25-49 52-28m-10-16 14 15-19 11" fill="none" stroke="#e8b18e" stroke-width="5" stroke-linecap="round"/><circle cx="325" cy="127" r="89" fill="#dcebba"/><text x="325" y="137" text-anchor="middle" fill="#193c3a" font-family="Segoe UI,sans-serif" font-size="58" font-weight="600" letter-spacing="-3">3:00</text><text x="325" y="163" text-anchor="middle" fill="#3e5d45" font-size="11" font-family="Segoe UI,sans-serif" font-weight="700" letter-spacing="1">JOUW VERHAAL</text><g stroke="#dcebba" stroke-width="6" stroke-linecap="round"><path d="M270 261v15m14-37v59m14-45v30m14-52v72m14-58v44m14-32v19m14-41v63m14-48v34m14-25v16"/></g><path d="m73 49 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z" fill="#e8b18e"/><circle cx="411" cy="232" r="6" fill="#e8b18e"/></svg>`;}
function homePage(){return `<section class="hero"><div><p class="eyebrow">Spreken • biografie • 3 minuten</p><h1 tabindex="-1">Laat je klas<br><em>meeleven.</em></h1><p class="lead">Je hebt een verhaal. Geef het een stem.<br>Oefen stap voor stap om vrij, duidelijk en boeiend te vertellen.</p><div class="hero-bottom"><button class="btn light" data-action="goals">Kies mijn werkpunten ${icon('arrow')}</button><span class="hero-tag">Jouw voorbereiding wordt een verhaal.</span></div></div>${heroArt()}</section>
<div class="section-head" id="goal-heading"><div><p class="eyebrow">Begin bij jezelf</p><h2>Waar wil jij aan werken?</h2><p>Kies twee werkpunten. Je oefent gericht en probeert daarna het volledige verhaal.</p></div><span class="pill" id="goal-count">${state.goals.length} van 2 gekozen</span></div>
<div class="grid-3">${goals.map(g=>`<button class="goal-card" data-goal="${g.id}" aria-pressed="${state.goals.includes(g.id)}"><span class="goal-top"><span class="goal-icon">${icon(g.icon)}</span><span class="tick" aria-hidden="true">✓</span></span><strong>${g.title}</strong><p>${g.desc}</p></button>`).join('')}</div>
<div class="routebar"><div><strong id="route-title">${state.goals.length===2?'Jouw oefenroute staat klaar.':'Kleine stappen. Hoorbaar verschil.'}</strong><p id="route-description">${routeDescription()}</p></div><button class="btn" data-action="route">Maak mijn spreekkaart ${icon('arrow')}</button></div>
<details class="details"><summary>Ik weet nog niet goed wat mijn werkpunten zijn.</summary><div class="inside"><p>Vertel 30 seconden over je hoofdfiguur. Gebruik je voorbereiding zoals je dat normaal doet. Laat iemand luisteren, of luister zelf aandachtig naar je manier van vertellen.</p>${miniTimer('proef')}<ol><li>Keek je vooral naar de tekst? Kies <strong>aflezen</strong>.</li><li>Klonk elke zin ongeveer hetzelfde? Kies <strong>eentonig</strong>.</li><li>Kon je luisteraar niet volgen of raakten woorden verward? Onderzoek <strong>tempo</strong> en <strong>uitspraak</strong>.</li><li>Raakte je de draad kwijt door spanning? Kies <strong>stress</strong>.</li></ol><p>Een kleine hapering hoeft geen werkpunt te worden. Kies wat de duidelijkheid of aantrekkelijkheid van je verhaal echt helpt.</p></div></details>
<div class="grid-2"><div class="panel"><p class="eyebrow">Zo oefenen we</p><h3>Weten → proberen → luisteren.</h3><p>Elke oefening eindigt met een controle op je eigen spreken. Aan het einde van elk onderdeel pas je de tips toe in een interactieve check.</p></div><div class="panel soft"><p class="eyebrow">Een haalbaar doel</p><h3>Maak je werkpunt concreet.</h3><p>“Vlotter spreken” wordt: “Ik vertel één moment vanuit vier kernwoorden en laat mijn partner de gebeurtenis navertellen.”</p></div></div>${renderQuiz('start')}`;}
function routeDescription(){return state.goals.length?state.goals.map(id=>goals.find(g=>g.id===id).title).join(' · '):'Kies hierboven twee werkpunten. Alle onderdelen blijven beschikbaar.';}
function storyPage(){return `${intro('02','Een leven.<br>Een sterke rode draad.','Kies één betekenisvol sleutelmoment. Maak duidelijk wat er gebeurde en waarom het iets veranderde.','card')}
<div class="note"><strong>Je krijgt exact 3:00.</strong>Pauzes, diawissels en overgangen tellen mee. Je verhaal is afgerond wanneer de spreektijd stopt.</div>
<div class="section-head"><div><h2>Zo verdeel je je spreektijd.</h2><p>Klik op een blok. Dit schema helpt je oefenen; het is geen extra beoordelingsregel.</p></div></div>
<div class="timeline" aria-label="Tijdverdeling van 180 seconden">${blocks.map((b,i)=>`<button style="--weight:${Math.max(b.end-b.start,29)}" data-block="${i}" aria-pressed="${i===0}"><strong>${fmt(b.start)}–${fmt(b.end)}</strong><span>${b.name}</span></button>`).join('')}</div><div id="timeline-detail" class="timeline-detail" aria-live="polite">${blockDetail(0)}</div>
<div class="section-head"><div><h2>Maak je spreekkaart.</h2><p>Kernwoorden herinneren je aan je verhaal. Schrijf in het midden zo weinig mogelijk volledige zinnen.</p></div></div>
<div class="panel" style="margin-bottom:20px">${field('person','Over wie vertel je?','Naam van je hoofdfiguur','input')}${field('thread','Wat is de rode draad van dit leven?','Bijvoorbeeld: na een tegenslag opnieuw beginnen.','input')}</div>
<div class="story-fields">${blocks.map((b,i)=>`<article class="panel"><span class="label-num">0${i+1} / ${fmt(b.start)}–${fmt(b.end)}</span><h3>${b.name}</h3>${field(b.id,b.question,b.placeholder,'textarea','Noteer enkele kernwoorden. Een opening of slotzin mag je wel uitschrijven.')}</article>`).join('')}</div>
<div class="note warm"><strong>Verbeeld het moment, verzin geen feiten.</strong>Gebruik concrete informatie uit je bronnen. Schrijf geen gevoelens, gedachten of citaten toe aan je persoon als je niet weet of ze kloppen.</div>
<details class="details"><summary>Mijn tekst is te lang. Wat kan weg?</summary><div class="inside"><p>Bekijk elk detail: heb je het nodig om het sleutelmoment te begrijpen? Maakt het de gebeurtenis concreet? Of kan het weg? Probeer de selectie hieronder bij een verhaal over de terugkeer van een sporter na een blessure.</p><div class="selection-list">${[['doel','De wedstrijd waarvoor de sporter trainde.'],['kleur','De favoriete kleur van de sporter.'],['keuze','De beslissing om opnieuw te trainen.']].map(([id,s])=>`<div class="selection-row"><label for="sel-${id}">${s}</label><select id="sel-${id}" data-selection="${id}"><option value="">Kies …</option><option value="nodig">Nodig voor het verhaal</option><option value="detail">Een verhelderend detail</option><option value="weg">Kan weg</option></select></div>`).join('')}</div><button class="btn quiet small" style="margin-top:16px" data-action="selection">Bekijk de feedback</button><div id="selection-feedback" aria-live="polite"></div><p style="margin-top:18px">Oefen daarna hardop. Nog te lang? Schrap een herhaling of los weetje. Behoud het sleutelmoment en het slot.</p></div></details>
${miniCheck('story-say','Ik heb met deze vijf blokken de route van mijn verhaal hardop uitgelegd.','Mijn luisteraar kan zeggen hoe het sleutelmoment en het gevolg samenhangen.')}${renderQuiz('verhaal')}`;}
function blockDetail(i){const b=blocks[i];return `<strong>${b.name} · ${b.end-b.start} seconden</strong><p>${b.hint}</p>`;}
function tellPage(){return `${intro('03','Vertel het.<br>In je eigen woorden.','Je kent de feiten. Nu oefen je om je klas mee te nemen in het verhaal. Kleine pauzes en andere formuleringen mogen.','wave')}
<article class="exercise">${exerciseHead('01','Van tekst naar kernwoorden','2 minuten',['aflezen'])}<p class="recognize">“Ik kan mijn tekst goed, omdat ik hem kan aflezen.”</p><div class="exercise-grid"><div><ol><li>Kies één passage en noteer drie tot vijf kernwoorden.</li><li>Leg de volledige tekst weg. Bekijk een kernwoord en kijk op.</li><li>Vertel de gedachte alsof je die aan een klasgenoot uitlegt.</li><li>Vertel dezelfde passage nog eens, met andere zinnen en dezelfde feiten.</li></ol><p class="small">Ken je opening en je slot goed. Oefen het midden vanuit de volgorde van je gedachten.</p></div><div class="practice-visual"><p class="caption">FICTIEF OEFENVOORBEELD</p><h3>Noor wil opnieuw sporten.</h3><div class="anchor-chips"><span>training</span><span>blessure</span><span>herbeginnen</span></div><p>Bekijk → kijk op → vertel.</p>${miniTimer('kernwoorden')}</div></div>${miniCheck('tell-anchors','Ik kon dezelfde passage tweemaal vertellen zonder de oorspronkelijke zinnen te zoeken.','Nog lastig? Gebruik één extra kernwoord en probeer opnieuw.')}</article>
<article class="exercise">${exerciseHead('02','Laat het sleutelmoment leven','2 minuten',['intonatie','aflezen'])}<div class="exercise-grid"><div><p>Geef je luisteraar houvast: wat wilde de persoon? Wat bemoeilijkte dat? Wat deed die? Wat veranderde?</p><p class="speech-demo">Noor had maanden getraind. <span class="pause">/</span> Maar vlak ervoor raakte ze <em>geblesseerd</em>. <span class="pause">//</span> Ze kon niet deelnemen.</p><p class="small">Fictief voorbeeld. / = korte pauze, // = iets langere pauze.</p></div><div class="practice-visual"><p class="caption">ÉÉN WENDING, EEN ANDERE STEM</p><div class="wave" aria-hidden="true">${[12,18,32,45,34,18,9,9,16,41,62,49,25,17,12,7,15,22,12].map(h=>`<span style="--h:${h}px"></span>`).join('')}</div><p>Zeg eerst alle zinnen op dezelfde toon. Probeer daarna nadruk op de tegenslag en een stilte vóór het gevolg.</p></div></div><p>Enthousiast vertellen betekent betrokken klinken. Een ernstige gebeurtenis vraagt een passende toon, geen opgewekte toneelstem.</p>${miniCheck('tell-turn','Mijn luisteraar of ikzelf kon horen waar de wending zat.','Pas dit toe op een gecontroleerd sleutelmoment uit je eigen biografie.')}</article>
<article class="exercise">${exerciseHead('03','Pauzes geven je verhaal ruimte','2 minuten',['tempo','intonatie'])}<div class="exercise-grid"><div><ol><li>Splits een lange zin in twee korte gedachten.</li><li>Markeer een pauze tussen de gedachten.</li><li>Pauzeer vóór een belangrijke wending of na een moeilijk begrip.</li><li>Zoek je even naar een woord? Laat een korte stilte vallen.</li></ol><p>Een paar keer “uhm” is geen ramp. Oefen op samenhang en begrijpelijkheid; alle stiltes wegwerken helpt niet.</p></div><div class="practice-visual"><p class="caption">HETZELFDE VERHAAL, MEER HOUVAST</p><p class="speech-demo">Ze verloor de finale. <span class="pause">/</span> Toch gaf ze niet op. <span class="pause">//</span> Een jaar later stond ze er opnieuw.</p><p class="small">Fictief oefenvoorbeeld. Blijf bij je eigen verhaal trouw aan de feiten.</p></div></div>${miniCheck('tell-pauses','Ik heb op twee betekenisvolle plaatsen gepauzeerd en mijn luisteraar kon de gedachte volgen.')}</article>
<article class="exercise">${exerciseHead('04','Maak je overgangen hoorbaar','2 minuten',[])}<p>Een signaalwoord vertelt welk verband je legt. Kies op betekenis en gebruik niet bij elke overgang hetzelfde woord.</p><div class="signal-grid"><div class="signal-box"><small>Tijd</small><strong>een jaar later</strong></div><div class="signal-box"><small>Tegenstelling</small><strong>maar / toch</strong></div><div class="signal-box"><small>Gevolg</small><strong>daardoor</strong></div><div class="signal-box"><small>Afronding</small><strong>uiteindelijk</strong></div></div><p>Gebruik “daardoor” alleen als er echt een oorzakelijk verband is. Iets dat later gebeurt, is niet automatisch een gevolg.</p>${field('transition','Mijn overgang naar het sleutelmoment','Bijvoorbeeld: Maar op dat moment …','input')}${miniCheck('tell-signals','Ik heb mijn overgang hardop gebruikt en gecontroleerd of het verband klopt.')}</article>
<article class="exercise">${exerciseHead('05','Kijk op. Blijf in contact.','1 minuut',['aflezen','stress'])}<div class="exercise-grid"><div><ol><li>Kijk tijdens een gedachte naar een luisteraar.</li><li>Verplaats je blik daarna rustig naar een ander deel van de klas.</li><li>Sta naar de klas gericht, ook wanneer je een dia wisselt.</li><li>Gebruik een gebaar wanneer het iets verduidelijkt.</li></ol><p>Oefen eerst met één persoon. Je hoeft geen gebaren te tellen of voortdurend oogcontact te maken.</p></div><div class="practice-visual"><p class="caption">JE DIA ONDERSTEUNT JOU</p><div class="visual-cue"><svg viewBox="0 0 150 130" role="img" aria-label="Een spreker kijkt naar verschillende delen van het publiek"><rect x="42" y="5" width="90" height="53" rx="5" fill="#cedcba"/><path d="M55 20h58M55 32h35" stroke="#6c8855" stroke-width="4"/><circle cx="40" cy="55" r="12" fill="#193c3a"/><path d="M22 96V80a18 18 0 0 1 36 0v16" fill="#193c3a"/><path d="m45 74 35-10" stroke="#193c3a" stroke-width="8" stroke-linecap="round"/><g fill="#829c69"><circle cx="24" cy="116" r="10"/><circle cx="65" cy="116" r="10"/><circle cx="106" cy="116" r="10"/></g></svg><p>Een beeld en enkele woorden helpen. Een alinea op een dia nodigt uit tot voorlezen.</p></div></div></div>${miniCheck('tell-contact','Ik heb staand verteld en bleef naar mijn luisteraar gericht.')}</article>
<article class="exercise">${exerciseHead('06','Vind je draad terug','2 minuten',['stress','woorden'])}<div class="recovery"><span>Pauzeer</span> → <span>Bekijk je anker</span> → <span>Vertel verder</span></div><p>Verkeerde naam of datum? Zeg kort “Ik bedoel …” en ga verder. Een kleine verspreking die de betekenis niet verandert, hoeft geen herstart te worden.</p><p>Oefen bewust: laat je partner midden in je verhaal een teken geven. Pauzeer, vind je volgende kernwoord en ga verder. Je begint niet opnieuw bij de inleiding.</p><details class="details"><summary>Ik wil het zo goed doen dat ik vastloop.</summary><div class="inside"><p>Zet je voeten stevig neer, laat je schouders zakken en adem rustig uit. Kijk naar een luisteraar en gebruik je voorbereide openingszin. Je hoeft niet eerst alle spanning kwijt te zijn.</p><p>Een hapering is geen bewijs van te weinig inzet. Houd je aan de eventuele individuele afspraken met je leerkracht.</p></div></details>${miniCheck('tell-recover','Ik heb geoefend om na een onderbreking verder te gaan zonder herstart.')}</article>${renderQuiz('vertel')}`;}
function speechPage(){return `${intro('04','Duidelijk spreken.<br>Van begin tot einde.','Laat je namen, sleutelwoorden en zinnen goed horen. Oefen met woorden die je écht in je presentatie gebruikt.','mic')}
<article class="exercise">${exerciseHead('01','Je persoonlijke woordenlijst','3 minuten',['woorden'])}<p>Kies maximaal vijf woorden of namen waarover je twijfelt. Beluister een betrouwbaar uitspraakvoorbeeld, spreek na en oefen daarna de volledige zin. Voor een persoonsnaam zoek je liefst hoe de persoon zichzelf voorstelt.</p><p class="small">Schrijf de beklemtoonde lettergreep in hoofdletters. Gebruik je een vakterm? Voeg een korte uitleg toe voor je klas.</p><div>${[0,1,2,3,4].map(i=>`<div class="pronounce-row">${field('word'+i,'Woord / naam '+(i+1),'Eigen oefenwoord','input')}${field('stress'+i,'Klemtoon / houvast','Bijv. bio-gra-FIE','input')}${field('sentence'+i,'Mijn zin of korte uitleg','Gebruik het woord in je verhaal.','input')}</div>`).join('')}</div>${miniCheck('speech-list','Mijn luisterpartner kon mijn oefenwoorden herkennen in de volledige zin.','Oefen het woord dat nog onduidelijk was opnieuw. Je hoeft geen vijf woorden te vinden als twee woorden genoeg zijn.')}</article>
<article class="exercise">${exerciseHead('02','Welk woord verdient de nadruk?','1 minuut',['intonatie','woorden'])}<div class="exercise-grid"><div><p>Klik op een woord en zeg de zin hardop met nadruk op dat woord. Hoor je hoe de betekenis verschuift?</p><div class="accent-words" aria-label="Kies het woord met nadruk">${['Zij','won','die','wedstrijd.'].map((w,i)=>`<button data-accent="${i}" aria-pressed="${i===0}" class="${i===0?'active':''}">${w}</button>`).join('')}</div><p id="accent-feedback" class="note" aria-live="polite">ZÍJ won: je benadrukt wie won, bijvoorbeeld tegenover iemand anders.</p></div><div class="practice-visual"><p class="caption">PAS HET TOE</p><p class="big">Eén gedachte.<br>Eén duidelijk kernwoord.</p><p style="margin-top:15px">Kies nu een zin uit je eigen verhaal. Welk woord draagt de belangrijkste informatie? Geef dat woord nadruk.</p></div></div>${miniCheck('speech-accent','Ik heb in mijn eigen passage de betekenis met klemtoon verduidelijkt.')}</article>
<article class="exercise">${exerciseHead('03','Verstaanbaar tot achteraan','2 minuten',['woorden','tempo'])}<div class="exercise-grid"><div><ol><li>Neem twee zinnen uit je presentatie en spreek ze met normaal presentatievolume uit.</li><li>Behoud volume tot het laatste woord. Fluister niet en roep niet.</li><li>Laat iemand op afstand de belangrijkste naam en de kern van de zinnen herhalen.</li><li>Oefen precies het stukje dat nog onduidelijk klonk.</li></ol></div><div class="practice-visual"><p class="caption">KORTE GEDACHTEN, RUSTIGE ADEM</p><p class="speech-demo">Dit was zijn kans. <span class="pause">/</span> Hij besloot ervoor te gaan.</p><p>Adem op een natuurlijke gedachtepauze. Pers een lange zin niet op je laatste restje lucht naar buiten.</p></div></div><p>Moet je thuis stil zijn? Plan ook een oefenbeurt op een plek waar je op presentatievolume mag spreken. Stil inspreken test niet hoe je achteraan in de klas klinkt.</p>${miniCheck('speech-volume','Mijn luisteraar kon op afstand de kernwoorden en het einde van mijn zinnen verstaan.')}</article>
<article class="exercise">${exerciseHead('04','Een tempo dat je klas kan volgen','2 minuten',['tempo'])}<p>Vertel dertig seconden. Laat je luisteraar de gebeurtenis daarna in één zin navertellen. Lukt dat niet? Onderzoek samen waar het moeilijk werd: het tempo, een vakterm of de volgorde.</p>${miniTimer('tempo')}<p style="margin-top:16px">Voeg daar een pauze toe, leg het begrip kort uit of maak het verband duidelijker. Probeer dezelfde passage opnieuw. Er is geen verplicht aantal woorden per minuut: je hardop geoefende verhaal bepaalt hoeveel inhoud past.</p>${miniCheck('speech-tempo','Mijn luisteraar kon de gebeurtenis navertellen nadat ik één gerichte verandering aanbracht.')}</article>
<div class="note"><strong>Verzorgd Nederlands klinkt natuurlijk.</strong>De slot-n na een onbeklemtoonde e hoeft vaak niet te klinken, bijvoorbeeld in “lopen”. Je hoeft niet elke geschreven letter nadrukkelijk uit te spreken. Zorg dat je woorden goed herkenbaar blijven. <a href="https://taaladvies.net/uitspraak-slot-n/" target="_blank" rel="noopener">Lees het taaladvies.</a></div>
<details class="details"><summary>Moet mijn Vlaamse uitspraak helemaal verdwijnen?</summary><div class="inside"><p>Werk aan verzorgd, verstaanbaar Standaardnederlands. Een Belgisch-Nederlandse uitspraak is niet automatisch fout. Kies een concreet woord of een concrete klank om te oefenen in plaats van het vage doel “mijn accent wegwerken”.</p><p><a href="https://www.vlaanderen.be/team-taaladvies/taaladviezen/woordgebruik/standaardtaal/standaardtaal-verschillen-tussen-belgie-en-nederland" target="_blank" rel="noopener">Team Taaladvies over België en Nederland.</a></p></div></details>${renderQuiz('uitspraak')}`;}
function rehearsalPage(){return `${intro('05','Dit is je generale<br>repetitie.','Sta recht, zet je dia’s klaar en vertel je volledige verhaal. Elke pauze en elke diawissel telt mee.','clock')}
<div class="timer-layout"><div class="timer-card"><h3>Je spreektijd</h3><div class="timer-face"><svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="110"/><circle id="time-arc" class="time-arc" cx="120" cy="120" r="110" stroke-dasharray="691.15" stroke-dashoffset="0"/></svg><div class="digits"><span id="time-digits" class="time-digits" role="timer" aria-label="Resterende spreektijd">3:00</span><span id="time-caption">resterende spreektijd</span></div></div><div id="timer-message" class="timer-message" role="status">Begin te spreken wanneer je op Start drukt.</div><div class="timer-buttons"><button class="btn light" id="timer-start" data-action="timer-start">${icon('play')} Start mijn 3 minuten</button><button class="btn light" id="timer-stop" data-action="timer-stop" hidden>Ik ben klaar</button><button class="btn secondary" id="timer-new" data-action="timer-new" hidden>Nieuwe poging</button></div><p class="small">Geen pauzeknop. Op 3:00 stopt je beurt.<br>Houd de timer zichtbaar tijdens het oefenen.</p></div>
<div><div class="panel settings"><h3>Kies je oefenstand</h3><label class="form-field" style="margin-top:16px"><span>Begeleiding tijdens het spreken</span><select id="timer-mode"><option value="coach">Met tips op 2:30 en 2:50</option><option value="exam">Zoals voor de klas: alleen de tijd</option></select></label><label class="checkline"><input id="timer-sound" type="checkbox" checked><span>Een kort eindsignaal op 3:00</span></label><p class="small">Oefen je slot vanaf 2:30. Laat je laatste zin in de laatste seconden landen.</p></div>

<div id="attempt-result" class="note" ${timer.finished?'':'hidden'}></div><div class="section-head"><div><h2>Luister naar het effect.</h2><p>Luister zelf terug of vraag je partner om één concreet moment te benoemen. Er komt geen automatisch cijfer op je stem.</p></div></div>
<div class="grid-2"><div class="panel">${field('worked','Dit werkte goed','Noem een zin of een moment uit je verhaal.')}${field('noticed','Dit hoorde of zag ik','Bijvoorbeeld: mijn laatste woorden waren niet goed hoorbaar.')}${field('nexttry','Bij mijn volgende poging doe ik …','Kies één concrete verandering.')}</div><div class="panel soft"><h3>Je volgende poging</h3><ul><li><strong>Te lang?</strong> Schrap een herhaling of los detail. Versnel niet.</li><li><strong>Te kort?</strong> Verduidelijk de keuze of het gevolg binnen je sleutelmoment. Vul niet op met losse weetjes.</li><li><strong>De draad kwijt?</strong> Oefen de overgang naar je volgende kernwoord.</li><li><strong>Nog aan het spreken op 3:00?</strong> Zet het slot vroeger in en pas je selectie aan.</li></ul><div id="attempt-list">${attemptList()}</div></div></div>
${renderQuiz('repetitie')}`;}
function getGoalText(i){return String(state.fields['goal'+i]||goals.find(g=>g.id===state.goals[i])?.tip||'');}
function readyPage(){return `${intro('06','Je bent aan zet.','Neem je verhaal, je spreekkaart en twee concrete aandachtspunten mee. Je hoeft niet foutloos te zijn om je klas mee te nemen.','spark')}
<div id="summary-grid" class="summary-grid">${summaryTiles()}</div><p class="small" style="color:var(--muted)">Een afgeronde check betekent dat je de vragen én de oefencontrole hebt gedaan. Je echte presentatie beoordeelt je leerkracht met de rubric.</p>
<div class="section-head"><div><h2>Jouw laatste aandachtspunten.</h2><p>Maak ze klein genoeg om tijdens het spreken te gebruiken.</p></div></div><div class="final-goals"><div class="panel">${field('goal0','Mijn eerste aandachtspunt','Wat ga ik concreet doen?')}</div><div class="panel">${field('goal1','Mijn tweede aandachtspunt','Wat ga ik concreet doen?')}</div></div>
<div class="speakcard" id="speakcard">${speakcard()}</div><div class="toolbar"><button class="btn" data-action="print">${icon('print')} Print mijn spreekkaart</button><button class="btn secondary" data-action="download-work">Download mijn werk</button><button class="btn quiet" data-action="import-work">Bewaard werk openen</button></div>
<div class="grid-2"><div class="panel soft"><p class="eyebrow">Vlak voor je begint</p><h3>Een rustige start.</h3><ol><li>Controleer de volgorde van je dia’s.</li><li>Zet je voeten stevig neer en adem rustig uit.</li><li>Kijk naar een luisteraar.</li><li>Begin met je voorbereide openingszin.</li></ol></div><div class="panel"><p class="eyebrow">Als je even vastloopt</p><h3>Je kunt verder.</h3><p>Pauzeer. Bekijk het volgende kernwoord. Ga verder met een overgang zoals “Wat daarna veranderde, was …”.</p><p>Op 2:30 nog niet bij de afronding? Gebruik: “Het belangrijkste gevolg was …” en ga naar je slot.</p></div></div>

function speakcard(){return `<p class="eyebrow">Mijn spreekkaart • 3:00</p><h3>${esc(state.fields.person||'Mijn hoofdfiguur')}</h3><p>${esc(state.fields.thread||'Vul bij Mijn verhaal de rode draad in.')}</p>${blocks.map(b=>`<div class="speakcard-line"><strong>${fmt(b.start)}–${fmt(b.end)}<br>${b.name}</strong><p>${esc(state.fields[b.id]||'Nog geen kernwoorden ingevuld.')}</p></div>`).join('')}<div class="speakcard-line"><strong>Mijn overgang</strong><p>${esc(state.fields.transition||'Kies een overgang die het verband duidelijk maakt.')}</p></div><div class="speakcard-line"><strong>Mijn werkpunten</strong><p>1. ${esc(getGoalText(0)||'Kies een concreet aandachtspunt.')}<br>2. ${esc(getGoalText(1)||'Kies een concreet aandachtspunt.')}</p></div><div class="speakcard-line"><strong>Oefenwoorden</strong><p>${[0,1,2,3,4].filter(i=>state.fields['word'+i]).map(i=>`${esc(state.fields['word'+i])}${state.fields['stress'+i]?' — '+esc(state.fields['stress'+i]):''}`).join('<br>')||'Nog geen oefenwoorden ingevuld.'}</p></div>`;}
function quizPassed(id){const q=quizData[id];return !!state.reviewed[id]&&q.questions.every((x,i)=>state.answers[id+'-'+i]===x[2]);}
function prereq(id){if(id==='start'&&state.goals.length!==2)return 'Kies eerst twee werkpunten bovenaan.';if(id==='verhaal'&&!blocks.every(b=>String(state.fields[b.id]||'').trim()))return 'Vul eerst de vijf blokken van je spreekkaart in.';if(id==='repetitie'&&!state.attempts.length)return 'Doe eerst een oefenbeurt met de timer.';if(id==='repetitie'&&!String(state.fields.nexttry||'').trim())return 'Noteer eerst één concrete verandering voor je volgende poging.';if(id==='klaar'&&(!getGoalText(0).trim()||!getGoalText(1).trim()))return 'Formuleer eerst je twee persoonlijke aandachtspunten.';return '';}
function complete(id){return quizPassed(id)&&quizData[id].tasks.every(([t])=>state.tasks[t])&&!prereq(id);}
function renderQuiz(id){const q=quizData[id];return `<section class="check-block" aria-labelledby="check-${id}"><div class="check-title"><span class="icon-wrap">${icon('check')}</span><div><p class="eyebrow" style="margin-bottom:7px">Jouw interactieve check</p><h2 id="check-${id}">${q.title}</h2></div></div><p class="check-intro">Kies bij elke situatie de beste aanpak. Controleer daarna wat je zelf hebt geoefend. Je krijgt feedback en kunt opnieuw proberen.</p>${q.questions.map((x,i)=>`<div class="quiz-item"><fieldset><legend>${i+1}. ${x[0]}</legend><div class="answer-options">${x[1].map((answer,j)=>`<label><input type="radio" name="q-${id}-${i}" data-quiz="${id}" data-question="${i}" value="${j}" ${state.answers[id+'-'+i]===j?'checked':''}><span>${answer}</span></label>`).join('')}</div></fieldset><div id="feedback-${id}-${i}" ${state.reviewed[id]?'':'hidden'}></div></div>`).join('')}<div class="apply-checks"><h3>En nu jouw eigen spreken</h3><p class="small">Vink aan wat je echt hebt gedaan. Een oefencontrole blijft jouw eigen inschatting.</p>${q.tasks.map(([t,l])=>taskCheck(t,l)).join('')}</div><div class="check-actions"><button class="btn" data-action="quiz" data-section="${id}">Controleer mijn aanpak ${icon('check')}</button><button class="plain" data-action="quiz-reset" data-section="${id}">Check opnieuw doen</button></div><p class="check-status" id="check-status-${id}" role="status"></p></section>`;}
function updateQuiz(id,announce=false){const q=quizData[id];if(!$('#check-status-'+id))return;const checked=state.reviewed[id];q.questions.forEach((x,i)=>{const box=$('#feedback-'+id+'-'+i);box.hidden=!checked;if(!checked)return;const a=state.answers[id+'-'+i],right=a===x[2];box.className='feedback'+(right?'':' retry');box.textContent=a===undefined?'Kies eerst een antwoord.':(right?'Dat helpt. ':'Probeer opnieuw. ')+x[3];});const n=q.questions.filter((x,i)=>state.answers[id+'-'+i]===x[2]).length;let msg='';if(checked){msg=complete(id)?'Onderdeel afgerond. Je hebt de aanpak begrepen en je oefencontrole ingevuld.':n<q.questions.length?`${n} van ${q.questions.length} situaties goed aangepakt. Lees de feedback en pas je keuze aan.`:prereq(id)||'Je aanpak klopt. Doe ook de oefencontrole hierboven en vink aan wat je hebt gedaan.';}$('#check-status-'+id).textContent=msg;if(announce&&complete(id))toast('Dit onderdeel is afgerond. Je kunt verder.');updateProgress();}
function summaryTiles(){return steps.map(([id,label],i)=>`<div class="summary-tile ${complete(id)?'done':''}"><b>${complete(id)?'✓':String(i+1).padStart(2,'0')}</b>${label}<br><span>${complete(id)?'Afgerond':'Nog te doen'}</span></div>`).join('');}
function updateProgress(){const n=steps.filter(([id])=>complete(id)).length;if($('#progress-fill'))$('#progress-fill').style.width=(n/6*100)+'%';if($('#progress-count'))$('#progress-count').textContent=n+' / 6 checks';$$('[data-nav]').forEach(el=>{if(el.closest('.nav')){const done=complete(el.dataset.nav);el.classList.toggle('complete',done);const i=steps.findIndex(s=>s[0]===el.dataset.nav);el.querySelector('.stepnum').textContent=done?'✓':String(i+1).padStart(2,'0');}});if($('#summary-grid'))$('#summary-grid').innerHTML=summaryTiles();}
function render(id,focus=true){if(!steps.some(s=>s[0]===id))id='start';if(timer.running&&id!=='repetitie'){toast('Rond eerst je oefenbeurt af. De drie minuten lopen door.');history.replaceState(null,'','#repetitie');return;}page=id;clearInterval(miniInterval);miniId='';const renders={start:homePage,verhaal:storyPage,vertel:tellPage,uitspraak:speechPage,repetitie:rehearsalPage,klaar:readyPage};$('#main').innerHTML=`<div class="section-enter">${renders[id]()}${id!=='klaar'?nextRow(id):''}</div>`;$$('[data-field]').forEach(el=>{el.value=state.fields[el.dataset.field]||'';if(id==='klaar'&&/^goal[01]$/.test(el.dataset.field))el.value=getGoalText(Number(el.dataset.field.at(-1)));});$$('[data-selection]').forEach(el=>el.value=state.selection[el.dataset.selection]||'');$$('.nav [data-nav]').forEach(el=>{const active=el.dataset.nav===id;el.classList.toggle('current',active);active?el.setAttribute('aria-current','step'):el.removeAttribute('aria-current');});history.replaceState(null,'','#'+id);updateQuiz(id);updateProgress();updateSave();if(id==='repetitie')hydrateTimer();if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main h1')?.focus({preventScroll:true});}document.title=`${steps.find(s=>s[0]===id)[1]} · Vertel het. In 3 minuten.`;}
function nextRow(id){const n=steps.findIndex(s=>s[0]===id),next=steps[n+1];return `<div class="next-row"><p>Je mag altijd terugkeren om verder te oefenen.</p><button class="btn secondary" data-nav="${next[0]}">Volgende: ${next[1]} ${icon('arrow')}</button></div>`;}
function attemptList(){if(!state.attempts.length)return '<p class="small" style="margin-top:20px">Je oefenbeurten verschijnen hier.</p>';return '<h4 style="margin:25px 0 12px">Je laatste oefenbeurten</h4>'+state.attempts.slice(-4).reverse().map(a=>`<div class="attempt"><strong>${fmt(a.elapsed)}</strong><span>${a.cutoff?'Tijd voorbij · controleer of je slot af was.':`${180-Math.floor(a.elapsed)} seconden ongebruikt · verfijn je timing.`}</span></div>`).join('');}
function openTeacher(){const d=$('#teacher');if(!d.innerHTML){d.innerHTML=`<div class="modal-head"><h2>Voor de leerkracht</h2><button class="btn quiet small" data-close="teacher">Sluiten</button></div><div class="modal-body"><h3>Oefenen met een hoorbaar resultaat</h3><p>De leerlingreflecties zijn anoniem vertaald naar zes herkenbare werkpunten. De checks toetsen de gekozen aanpak; de leerling en een luisterpartner controleren de toepassing. De app geeft geen cijfer voor uitspraak of spontaniteit.</p><h3>Leerplankader</h3><p>Uitgangspunt: III-Ned-da, Katholiek Onderwijs Vlaanderen, oktober 2024. LPD 4: doelgericht spreken; LPD 11–13: taalgebruik, taalsysteem en woordenschat functioneel inzetten; LPD 14: passende strategieën gebruiken. Voor Taal en communicatie en Toerisme bestaat een apart leerplan.</p><p class="sources"><a href="https://pro.katholiekonderwijs.vlaanderen/iii-ned-da/leerplan" target="_blank" rel="noopener">Officiële leerplanpagina</a> · <a href="https://pro.katholiekonderwijs.vlaanderen/download/content/039ac72a-0998-413b-9fb1-104dcf3a7504/attachments/III-Ned-da_oktober_24.pdf" target="_blank" rel="noopener">Leerplan, p. 15, 19–22 en 32</a></p><h3>De aangeleverde rubric</h3><p>De uitgewerkte rubric uit de afbeelding is leidend. Bij de livepresentatie krijgt oogcontact betrekking op de klas. De app wijzigt geen puntenverdeling. Tempo en klemtoon kunnen zowel verstaanbaarheid als aantrekkelijkheid ondersteunen.</p><div class="table-scroll" tabindex="0" role="region" aria-label="Evaluatierubric, horizontaal schuifbaar"><table class="rubric"><thead><tr>${['Criterium','Uitstekend','Goed','Voldoende','Zwak'].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rubricRows.map(row=>'<tr>'+row.map((cell,i)=>i===0?`<th scope="row" style="background:#edf2e3;color:#193c3a">${esc(cell)}</th>`:`<td>${esc(cell)}</td>`).join('')+'</tr>').join('')}</tbody></table></div><h3>Gebruik in de les</h3><ol><li>Laat leerlingen twee werkpunten kiezen en hun verhaal selecteren.</li><li>Laat hen per oefenbeurt één gericht punt verbeteren. Wissel spreker en luisteraar af.</li><li>Voer de volledige repetitie staand uit, met diawissels. De beurt stopt na 180 seconden.</li><li>Vraag concrete feedback: een moment, een waarneming en een volgende handeling.</li></ol><p>Een kleine hapering is geen automatische onvoldoende. Houd rekening met bestaande individuele afspraken. De tijdverdeling in vijf blokken is een oefenhulp, geen extra rubriccriterium.</p><h3>Taaladvies</h3><p class="sources"><a href="https://taaladvies.net/uitspraak-slot-n/" target="_blank" rel="noopener">Uitspraak van de slot-n</a> · <a href="https://www.vlaanderen.be/team-taaladvies/taaladviezen/woordgebruik/standaardtaal/standaardtaal-verschillen-tussen-belgie-en-nederland" target="_blank" rel="noopener">Standaardtaal in België en Nederland</a></p><h3>Werk bewaren</h3><p>Invoer en checks worden waar mogelijk op het eigen toestel bewaard. Bij ‘Klaar voor de klas’ kan de leerling werk downloaden en later openen. Geluidsopnamen worden niet geüpload en blijven alleen beschikbaar tot de pagina sluit, tenzij de leerling ze zelf bewaart.</p><button class="btn danger small" data-action="reset-open">Mijn opgeslagen oefenwerk wissen</button></div>`;}d.showModal();}
function downloadWork(){const blob=new Blob([JSON.stringify({...state,version:1},null,2)],{type:'application/json'});downloadBlob(blob,'mijn-vertelwerk.json');toast('Je werk is gedownload. Bewaar dit bestand om later verder te gaan.');}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
async function importWork(file){if(!file)return;if(file.size>1000000){toast('Dit bestand is te groot. Open een eerder gedownload bestand met vertelwerk.');return;}try{const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.goals)||!d.fields||typeof d.fields!=='object'||Array.isArray(d.fields))throw Error();const clean={goals:d.goals.filter(x=>goals.some(g=>g.id===x)).slice(0,2),fields:{},answers:{},tasks:{},reviewed:{},practice:{},selection:{},attempts:[]};for(const [k,v]of Object.entries(d.fields))if(/^[a-zA-Z0-9_-]{1,40}$/.test(k)&&typeof v==='string')clean.fields[k]=v.slice(0,20000);for(const [id,q]of Object.entries(quizData)){clean.reviewed[id]=d.reviewed?.[id]===true;q.questions.forEach((_,i)=>{const a=d.answers?.[id+'-'+i];if(Number.isInteger(a)&&a>=0&&a<3)clean.answers[id+'-'+i]=a;});q.tasks.forEach(([t])=>clean.tasks[t]=d.tasks?.[t]===true);}if(d.practice&&typeof d.practice==='object')for(const[k,v]of Object.entries(d.practice))if(/^[a-z-]{1,50}$/.test(k))clean.practice[k]=v===true;if(Array.isArray(d.attempts))clean.attempts=d.attempts.filter(a=>Number.isFinite(a.elapsed)&&a.elapsed>=0&&a.elapsed<=180).slice(-8).map(a=>({elapsed:a.elapsed,cutoff:a.cutoff===true}));state=clean;save();render('klaar');toast('Je bewaarde werk is geopend.');}catch(e){toast('Dit is geen geldig bestand met vertelwerk. Kies een bestand dat je uit deze app hebt gedownload.');}}
function runMini(id,seconds){clearInterval(miniInterval);if(miniId&&$('#mini-status-'+miniId))$('#mini-status-'+miniId).textContent='Vorige korte oefening gestopt.';miniId=id;const deadline=Date.now()+seconds*1000;const tick=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000)),out=$('#mini-'+id);if(!out){clearInterval(miniInterval);return;}out.textContent=fmt(left);if(left===0){clearInterval(miniInterval);$('#mini-status-'+id).textContent='Tijd. Controleer het resultaat en probeer zo nodig opnieuw.';miniId='';}};$('#mini-status-'+id).textContent='Vertel hardop. De oefentijd loopt.';tick();miniInterval=setInterval(tick,150);}
function hydrateTimer(){if($('#timer-mode'))$('#timer-mode').value=timer.mode;if($('#timer-sound'))$('#timer-sound').checked=timer.sound;updateTimerUI();if(audioUrl){$('#audio-result').hidden=false;$('#audio-player').src=audioUrl;$('#audio-download').href=audioUrl;}if(micStream){$('#mic-status').textContent='Microfoon klaar. De opname begint wanneer je de timer start.';$('#mic-prepare').textContent='Microfoon uitschakelen';}if(timer.finished)showAttemptResult();}
function updateTimerUI(){if(!$('#time-digits'))return;const left=timer.running?secondsLeft(timer.deadline):timer.finished?Math.max(0,180-Math.floor(timer.elapsed)):180;$('#time-digits').textContent=fmt(left);$('#time-arc').setAttribute('stroke-dashoffset',String(691.15*(1-left/180)));$('#timer-start').hidden=timer.running||timer.finished;$('#timer-stop').hidden=!timer.running;$('#timer-new').hidden=!timer.finished;$('#timer-mode').disabled=timer.running;$('#timer-sound').disabled=timer.running;$('#mic-prepare').disabled=timer.running;let message='Begin te spreken wanneer je op Start drukt.';const phase=phaseAt(timer.running?180-left:timer.elapsed);if(timer.running){message=timer.mode==='exam'?'Je beurt loopt. Vertel je verhaal.':phase==='afronden'?'Nog 10 seconden. Rond je laatste gedachte af.':phase==='slot'?'Nog 30 seconden. Begin je slot.':'Neem je klas mee in je verhaal.';}else if(timer.finished)message=timer.elapsed>=180?'Stop. De spreektijd is voorbij.':'Je hebt je oefenbeurt beëindigd.';if($('#timer-message').textContent!==message)$('#timer-message').textContent=message;$('#time-arc').style.stroke=phase==='afronden'?'#f4b393':'#dcebba';$('#time-caption').textContent=timer.finished?'resterend bij het einde':'resterende spreektijd';}
async function prepareMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;$('#mic-prepare').innerHTML=icon('mic')+' Microfoon klaarzetten';$('#mic-status').textContent='Microfoon uit. Je kunt zonder opname oefenen.';return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('#mic-status').textContent='Opnemen is hier niet beschikbaar. Gebruik een recente browser of oefen met een luisterpartner. De timer en alle oefeningen werken gewoon.';return;}$('#mic-prepare').disabled=true;$('#mic-status').textContent='Geef je browser toegang tot de microfoon om op te nemen.';try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});if(page!=='repetitie'){micStream.getTracks().forEach(t=>t.stop());micStream=null;return;}$('#mic-status').textContent='Microfoon klaar. Opnemen begint samen met de timer.';$('#mic-prepare').textContent='Microfoon uitschakelen';}catch(e){if($('#mic-status'))$('#mic-status').textContent='Geen microfoon beschikbaar of geen toegang gegeven. Je kunt gewoon zonder opname of met een luisterpartner oefenen.';}finally{if($('#mic-prepare'))$('#mic-prepare').disabled=timer.running;}}
function beginRecording(){if(!micStream)return;try{recordChunks=[];const type=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(micStream,type?{mimeType:type}:undefined);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};recorder.onstop=()=>{if(recordChunks.length){if(audioUrl)URL.revokeObjectURL(audioUrl);const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});audioUrl=URL.createObjectURL(blob);if($('#audio-result')){$('#audio-result').hidden=false;$('#audio-player').src=audioUrl;$('#audio-download').href=audioUrl;$('#audio-download').download='mijn-oefenbeurt.'+(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm');$('#mic-status').textContent='Opname klaar. Luister terug en kies één werkpunt.';}}};recorder.start();$('#mic-status').textContent='Opname loopt. Ze stopt samen met je oefenbeurt.';}catch(e){toast('Opnemen lukt hier niet. De timer werkt zonder opname.');}}
function startTimer(){if(timer.running)return;timer.mode=$('#timer-mode').value;timer.sound=$('#timer-sound').checked;if(timer.sound){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();}catch(e){}}
timer.running=true;timer.finished=false;timer.elapsed=0;timer.deadline=Date.now()+180000;$('#attempt-result').hidden=true;if($('#audio-player'))$('#audio-player').pause();beginRecording();updateTimerUI();timer.interval=setInterval(tickTimer,100);timer.timeout=setTimeout(()=>finishTimer(true),180000);}
function tickTimer(){if(!timer.running)return;if(Date.now()>=timer.deadline){finishTimer(true);return;}updateTimerUI();}
function finishTimer(cutoff=false){if(!timer.running)return;timer.elapsed=cutoff?180:Math.min(180,Math.max(0,180-(timer.deadline-Date.now())/1000));timer.running=false;timer.finished=true;clearInterval(timer.interval);clearTimeout(timer.timeout);if(recorder&&recorder.state==='recording')recorder.stop();state.attempts.push({elapsed:Math.floor(timer.elapsed),cutoff:cutoff||timer.elapsed>=180});state.attempts=state.attempts.slice(-8);save();updateTimerUI();showAttemptResult();if($('#attempt-list'))$('#attempt-list').innerHTML=attemptList();if(cutoff&&timer.sound&&audioCtx){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=660;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.55);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.55);}catch(e){}}updateQuiz('repetitie');}
function showAttemptResult(){const el=$('#attempt-result');if(!el)return;el.hidden=false;el.innerHTML=timer.elapsed>=180?'<strong>3:00 · De beurt is voorbij.</strong>Was je verhaal afgerond? Noteer hieronder wat goed ging en wat je aanpast. Nog niet bij je slot? Schrap een detail en oefen opnieuw.':`<strong>Je eindigde op ${fmt(timer.elapsed)}.</strong>Je hebt ${180-Math.floor(timer.elapsed)} seconden ongebruikt. Werk je sleutelmoment of de betekenis iets verder uit en verfijn je timing. Het doel blijft een afgerond verhaal bij 3:00.`;}
function deleteAudio(){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl='';recordChunks=[];if($('#audio-player')){$('#audio-player').removeAttribute('src');$('#audio-player').load();$('#audio-result').hidden=true;}toast('De geluidsopname is verwijderd.');}
document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-action]');if(!b)return;if(b.dataset.nav){render(b.dataset.nav);return;}if(b.dataset.close){$('#'+b.dataset.close).close();return;}if(b.dataset.goal){const id=b.dataset.goal;if(state.goals.includes(id))state.goals=state.goals.filter(x=>x!==id);else if(state.goals.length<2)state.goals.push(id);else{toast('Kies maximaal twee werkpunten. Klik op een gekozen werkpunt om het te vervangen.');return;}$$('[data-goal]').forEach(x=>x.setAttribute('aria-pressed',String(state.goals.includes(x.dataset.goal))));$('#goal-count').textContent=state.goals.length+' van 2 gekozen';$('#route-title').textContent=state.goals.length===2?'Jouw oefenroute staat klaar.':'Kleine stappen. Hoorbaar verschil.';$('#route-description').textContent=routeDescription();save();updateQuiz('start');return;}if(b.dataset.block!==undefined){$$('[data-block]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#timeline-detail').innerHTML=blockDetail(Number(b.dataset.block));return;}if(b.dataset.accent!==undefined){const n=Number(b.dataset.accent);$$('[data-accent]').forEach(x=>{x.setAttribute('aria-pressed',String(x===b));x.classList.toggle('active',x===b);});$('#accent-feedback').textContent=['ZÍJ won: je benadrukt wie won, bijvoorbeeld tegenover iemand anders.','Zij WÓN: je benadrukt de overwinning, bijvoorbeeld tegenover verliezen.','Zij won DÍÉ wedstrijd: je maakt duidelijk welke wedstrijd je bedoelt.','Zij won die WEDSTRIJD: je benadrukt dat het om een wedstrijd ging, bijvoorbeeld tegenover een prijs buiten een wedstrijd.'][n];return;}
switch(b.dataset.action){case'goals':$('#goal-heading').scrollIntoView({behavior:'smooth'});$$('[data-goal]')[0].focus({preventScroll:true});break;case'route':if(state.goals.length!==2){toast('Kies eerst twee werkpunten.');return;}render('verhaal');break;case'quiz':state.reviewed[b.dataset.section]=true;save();updateQuiz(b.dataset.section,true);break;case'quiz-reset':{const id=b.dataset.section;delete state.reviewed[id];quizData[id].questions.forEach((_,i)=>delete state.answers[id+'-'+i]);quizData[id].tasks.forEach(([t])=>delete state.tasks[t]);save();const y=window.scrollY;render(id,false);window.scrollTo(0,y);break;}case'mini':runMini(b.dataset.mini,Number(b.dataset.seconds));break;case'selection':{const a=state.selection;let msg;if(!a.doel||!a.kleur||!a.keuze)msg='Maak eerst bij elk detail een keuze.';else msg=(a.kleur==='weg'&&a.keuze==='nodig'&&a.doel!=='weg'?'Sterke selectie. ':'Bekijk je selectie nog eens. ')+'De wedstrijd verklaart wat er op het spel stond. De favoriete kleur draagt hier niets bij. De beslissing om opnieuw te trainen is essentieel voor dit verhaal.';$('#selection-feedback').className='feedback';$('#selection-feedback').textContent=msg;break;}case'mic':prepareMic();break;case'timer-start':startTimer();break;case'timer-stop':finishTimer(Date.now()>=timer.deadline);break;case'timer-new':timer.finished=false;timer.elapsed=0;$('#attempt-result').hidden=true;updateTimerUI();break;case'audio-delete':deleteAudio();break;case'teacher':openTeacher();break;case'print':$('#print-card').innerHTML='<h1>Vertel het. In 3 minuten.</h1><p>Mijn houvast voor de presentatie</p><div class="speakcard">'+speakcard()+'</div><p>2:30: begin je slot. 3:00: de beurt stopt.</p>';window.print();break;case'download-work':downloadWork();break;case'import-work':$('#import-file').click();break;case'reset-open':if(timer.running){toast('Stop eerst je oefenbeurt voordat je je werk wist.');return;}$('#reset-dialog').showModal();break;case'reset-confirm':state={goals:[],fields:{},answers:{},tasks:{},reviewed:{},practice:{},selection:{},attempts:[]};save();timer.finished=false;timer.elapsed=0;deleteAudio();$$('dialog[open]').forEach(d=>d.close());render('start');toast('Je oefenwerk is gewist. Je kunt opnieuw beginnen.');break;}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){state.fields[el.dataset.field]=el.value;save();if(page==='klaar'&&$('#speakcard'))$('#speakcard').innerHTML=speakcard();updateQuiz(page);}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.quiz){state.answers[el.dataset.quiz+'-'+el.dataset.question]=Number(el.value);save();updateQuiz(el.dataset.quiz);}if(el.dataset.task){state.tasks[el.dataset.task]=el.checked;save();updateQuiz(page);}if(el.dataset.practice){state.practice[el.dataset.practice]=el.checked;save();}if(el.dataset.selection){state.selection[el.dataset.selection]=el.value;save();}if(el.id==='import-file'){importWork(el.files[0]);el.value='';}if(el.id==='timer-mode')timer.mode=el.value;if(el.id==='timer-sound')timer.sound=el.checked;});
window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'start'));
document.addEventListener('visibilitychange',()=>{if(timer.running)tickTimer();});
window.addEventListener('pagehide',()=>{if(micStream)micStream.getTracks().forEach(t=>t.stop());});
$('#nav').innerHTML=steps.map(([id,title],i)=>`<button data-nav="${id}"><span class="stepnum">${String(i+1).padStart(2,'0')}</span>${title}</button>`).join('');
render(location.hash.slice(1)||'start',false);
</script>
</body></html>
